# Ninja Gaiden II (544307D5, default.xex 2008-05-09 with Title Update 3) codegen overrides.
# Included from ng2_manifest.toml.

# Guest registers as C++ locals where they don't carry values between functions:
# the compiler can keep them in host registers instead of the shared context.
# Non-volatile registers (r14-r31, f14-f31, v14-v31, v64-v127) are each
# function's own (its prologue/epilogue save helpers are dropped); SEH funclets
# keep the shared ones. The vector registers below are read before being
# written by functions that take values in them from their callers (the video
# codec's transform kernels: v64, v65, v69, v72; sub_83795F68: v29, v30), found
# by scanning the generated code, so they stay in the shared context.
ctr_as_local = true
xer_as_local = true
cr_as_local = true
reserved_as_local = true
non_volatile_as_local = true
shared_vector_registers = [29, 30, 64, 65, 69, 72]

# MSVC CRT; libjpeg's error_exit longjmps out of the decoder.
setjmp_address = 0x8397B4E0
longjmp_address = 0x8397B1C0

[functions]
# this-adjustor thunks (addi r3,r3,N; b ...) the analysis skipped
0x83780438 = { size = 8 }
0x83781800 = { size = 8 }
# ends in a no-return KeBugCheck; SwitchToFiber starts right after it
0x8383E8F0 = { size = 0x10 }
0x8383E900 = { name = "SwitchToFiber" }

# XAPI fibers run on the SDK's host fibers.
[rexcrt]
ConvertThreadToFiber = 0x83833B20
ConvertFiberToThread = 0x83833BB0
CreateFiber = 0x83833C00
DeleteFiber = 0x83833CE0
SwitchToFiber = 0x8383E900

# Cheats (src/cheats.cpp): Mission Mode's difficulty count, just loaded.
[[midasm_hook]]
address = 0x823E4A80
name = "Ng2MissionDifficulties"
registers = ["r11", "r31"]

# The main loop's wait for the render thread to take the frame (src/frame_wait.cpp).
[[midasm_hook]]
address = 0x822F3580
name = "Ng2FrameHandoffWait"
registers = ["r11"]

# The render thread's waits for the main loop's next frame (src/frame_wait.cpp): for the
# handoff word (0x84C53430) to be set, then for the word after it, each at the loop's check
# of the quit flag, reached only while still waiting.
[[midasm_hook]]
address = 0x822F1858
name = "Ng2FrameWait"

[[midasm_hook]]
address = 0x822F1874
name = "Ng2FrameWait"

# The render thread's wait for the vblank count to move on (src/frame_wait.cpp), at the
# loop's low-priority hint (and r1,r1,r1), reached only while still waiting.
[[midasm_hook]]
address = 0x822F0C68
name = "Ng2VblankWait"

# Extras and their cheats (src/extras.cpp).
# The pad state before the four pads are merged: r5 the first pad's words.
[[midasm_hook]]
address = 0x822F337C
name = "Ng2ExtrasPad"
registers = ["r5"]

